spring.application.name=skycast
server.port=8081

# Upstream APIs (Open-Meteo is free and needs no API key)
weather.api.geocoding-url=https://geocoding-api.open-meteo.com
weather.api.forecast-url=https://api.open-meteo.com
weather.api.timeout-seconds=5

# Origins allowed to call the API directly (the Vite dev proxy does not need CORS)
weather.cors.allowed-origins=http://localhost:5173

# Cache identical lookups for 10 minutes
spring.cache.cache-names=weather
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Errors as RFC 7807 problem+json
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
